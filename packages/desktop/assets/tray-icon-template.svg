<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Painted bottom-up. For each upper plate: first a black STROKE along its
       outline (which bites into the plate below), then the plate itself filled
       white on top — so only the outer half of the stroke survives and becomes
       a thin gap. The app icon separates these three with colour; a macOS
       template image has only the alpha channel to say it with. -->
  <mask id="body">
    <rect x="8"  y="28" width="48" height="28" rx="6" fill="#fff"/>

    <rect x="12" y="16" width="40" height="28" rx="6" fill="none" stroke="#000" stroke-width="5"/>
    <rect x="12" y="16" width="40" height="28" rx="6" fill="#fff"/>

    <rect x="16" y="4"  width="32" height="28" rx="6" fill="none" stroke="#000" stroke-width="5"/>
    <rect x="16" y="4"  width="32" height="28" rx="6" fill="#fff"/>

    <circle cx="32" cy="18" r="6" fill="#000"/>
  </mask>
  <rect width="64" height="64" fill="#000" mask="url(#body)"/>
</svg>
