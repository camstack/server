name: CI

# THE AUTOMATIC PIPELINE BUILDS AND TESTS — NOTHING ELSE (D704, 2026-10-06).
#
# Push, pull request and the nightly run one job: build every package, then run
# the tests (affected on push/PR, the full suite nightly). Repository guards,
# the pinned-debt typecheck/lint/format ratchet, codegen drift, the docs checks
# and the e2e suite moved to the ON-DEMAND workflow `checks.yml` ("Checks"),
# run with `gh workflow run Checks --ref main` before a release or after a
# change those checks protect. The automatic verdict was red for reasons that
# did not stop a build from shipping often enough that nobody read it any more;
# a pipeline that is green exactly when the code builds and its tests pass is
# one people look at.
#
# Dormant from 2026-04-18 to 2026-07-31 (`disabled_manually`) and again silently
# from ~2026-10-01 to 2026-10-06 (stale self-hosted runner version: jobs queued
# forever, every run ended `cancelled`). A run that never starts looks exactly
# like a run nobody pushed — check `gh run list --workflow=CI` after a push.
#
# Public CI runs on GitHub-hosted `ubuntu-latest` (4 vCPU, 16 GB). A pull
# request gets the default token only — do not add a repository secret here,
# and do not switch this trigger to `pull_request_target`.

on:
  workflow_dispatch:
  schedule:
    # Nightly FULL suite — the safety net that lets pushes test only what
    # they touched. GitHub delays scheduled runs under load, worst at the top
    # of the hour and the half hours (measured 2026-10-28: a 03:30 trigger
    # started 09:15-09:55 UTC), so the trigger sits at an off-peak odd minute
    # early in the night to leave room for the queue.
    - cron: "17 1 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Cache save. A fork pull request is downgraded to read and runs cold.
  actions: write

# A burst of pushes queues a full job each. A superseded run is cancelled
# rather than left to occupy a hosted runner.
#
# Main used to be exempt, on the argument that cancelling meant the default
# branch could never produce a complete verdict (measured 2026-08-21: four
# consecutive runs cancelled mid-flight). The argument was right about the
# symptom and wrong about the remedy: the complete verdict is the NIGHTLY run,
# which fires at 03:30 UTC precisely when nobody is pushing. During a working
# day the exemption bought nothing except a queue of stale runs grading commits
# that had already been superseded — which is what the operator was seeing.
#
# The group is keyed on the EVENT as well as the ref: a schedule and a push both
# carry `refs/heads/main`, so sharing one group would let an afternoon push
# cancel the nightly full suite — the one run this whole arrangement depends on.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# NODE_OPTIONS is deliberately NOT set here. A job-wide 8 GB heap ceiling is
# inherited by every vitest fork. The Checks workflow keeps that ceiling on
# its static typecheck (D704). Each step here sets its own: build 4096 (three
# tasks fit in 16 GB), the typecheck step 8192, tests 4096.
env:
  NODE_VERSION: "24"

jobs:
  # One job per shard (D704 kept: still only build + test). A single serial job
  # took ~55 min once a `packages/types` change marked every package affected;
  # the heavy packages now run each in a job of their own and the light addons
  # in two groups. The shard table lives in scripts/ci/test-affected.sh (the
  # same file `npm run verify:push` runs, which executes every shard in turn).
  #
  # Concurrency: hosted `ubuntu-latest` runners, so the cap is the account's
  # concurrent-job limit, not a self-hosted label. 8 jobs per run (7 shards +
  # `static`); a burst of pushes is still cancelled by the concurrency group.
  # Each job pays install + the Nx-cache build read on its own VM, which is the
  # price of parallelism: wall clock is that setup plus the slowest shard.
  #
  # `static` carries what is not a per-project test: the typecheck, the repo
  # scripts and the python pool, once per run instead of once per shard.
  #
  # The required-check names changed with this: `tests (<shard>)`.
  tests:
    name: tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Cold: install + full build + a shard of tests. Warm: the build is an
    # actions/cache read of `.nx`. Hosted runners are 16 GB.
    timeout-minutes: 110
    strategy:
      # A red shard must not hide the verdict of the others.
      fail-fast: false
      matrix:
        shard:
          - system-1
          - system-2
          - pipeline-1
          - pipeline-2
          - post-analysis-1
          - post-analysis-2
          - admin-ui-1
          - admin-ui-2
          - admin-ui-3
          - ui-library
          - server-1
          - server-2
          - server-3
          - core
          - light-a
          - light-b
          - static
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The change set of a push / pull request, written once and read by every
      # later step (scoped build, scoped typecheck, footprint guard, tests).
      # Git + curl + node only: it runs before install on purpose.
      - name: Compute the change set (push/PR)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: scripts/ci/changed-files.sh "$RUNNER_TEMP/changed-files.txt"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}

      # Nx 23 keeps task bytes in `.nx/cache` and the index in
      # `.nx/workspace-data/<machine-id>-v3.db`. A tarball of `.nx/cache`
      # alone never hit (D548). Both directories are cached, keyed on the
      # lockfile and nx.json. The database file is named after the machine,
      # and a hosted VM is a new machine every job — `align-nx-db.sh` copies
      # the restored file onto this machine's id before nx opens it.
      # `NX_MAX_CACHE_SIZE` bounds the directory; the exact cache key is not
      # rewritten until the lockfile or nx.json changes.
      - name: Restore the Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'nx.json') }}
          restore-keys: |
            nx-${{ runner.os }}-${{ runner.arch }}-

      - name: Point the restored Nx database at this machine
        run: |
          echo "NX_DAEMON=false" >> "$GITHUB_ENV"
          echo "NX_MAX_CACHE_SIZE=4GB" >> "$GITHUB_ENV"
          bash scripts/ci/align-nx-db.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Steps below run through scripts/ci/mem-step.sh: the command is unchanged
      # and its exit code passes through; the wrapper appends peak RSS / cgroup
      # memory to the step summary and warns over <budget-MB> (MEM_BUDGET_ENFORCE=1
      # would fail the step — unset on purpose until the budgets are measured).
      #
      # `npm ci` is ~70 s on every job (measured 2026-10-31, run 41183402419).
      # node_modules — the root and each workspace's own — is restored from a
      # cache keyed on the lockfile and the Node major, which makes a hit ~15 s
      # and skips `npm ci`; `patch-package` (postinstall) acts inside
      # node_modules, so its result is cached with it. The exact key is saved by
      # the `static` job only, once per lockfile, so 17 jobs never upload the
      # same 600 MB in parallel; a job that misses simply installs.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            e2e/node_modules
            packages/*/node_modules
            server/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: scripts/ci/mem-step.sh install 8000 -- npm ci

      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true' && matrix.shard == 'static'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            e2e/node_modules
            packages/*/node_modules
            server/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      # `nx.json` lists `@camstack/nx-plugin` as a workspace plugin, and nx
      # refuses to load a local plugin whose `main` (./dist/index.js) does not
      # exist. A hosted runner is a fresh clone: EVERY nx command dies
      # with "Unable to resolve local plugin" before doing any work. Build it
      # with plain tsc first — this is the one build that cannot go through nx.
      - name: Bootstrap the Nx plugin (chicken-and-egg)
        run: npm run build -w packages/nx-plugin
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
      # The same build Checks runs, from the Nx cache: on a warm key this is a
      # cache read, on a cold one it is the one full build this job pays.
      # Tests resolve `@camstack/types` (and sdk /
      # ui-library / system) through `dist/`, so it cannot be skipped — see the
      # 2026-07-31 note on the `static` job's build step.
      #
      # Three tasks at once, each with a 4 GB heap, fit in the 16 GB hosted
      # runner. An 8 GB heap per task does not. The largest single program
      # needs ~3.4 GB (admin-ui on sources OOMs at 3 GB).
      # What a push can change is what it builds: `affected-scope.mjs` (the same
      # script `npm run verify:push` runs) lists the affected nx projects, and
      # `nx run-many -t build` builds those plus their dependencies (`^build`),
      # from the Nx cache. A framework package (types / system) affects every
      # project, so that push builds everything, as before. The nightly and a
      # manual run always build everything.
      - name: Scope the push (affected projects, typecheck dirs, footprint)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          node scripts/ci/affected-scope.mjs "$RUNNER_TEMP/changed-files.txt" | tee "$RUNNER_TEMP/scope.env"
          {
            echo "### Scope — shard \`${{ matrix.shard }}\`"
            echo '```'
            cat "$RUNNER_TEMP/scope.env"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build packages (affected on push/PR, all otherwise)
        run: |
          if [ -f "$RUNNER_TEMP/scope.env" ]; then
            # shellcheck disable=SC1091
            . "$RUNNER_TEMP/scope.env"
          else
            TC_DIRS=ALL
          fi
          if [ -z "$TC_DIRS" ]; then
            echo "no project affected — nothing to build"
          elif [ "$TC_DIRS" = "ALL" ]; then
            scripts/ci/mem-step.sh build 12000 -- npm run build -- --parallel=3
          else
            scripts/ci/mem-step.sh build 12000 -- npx nx run-many -t build --projects="$AFFECTED_CSV" --parallel=3
          fi
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # D28 (source): no bare '@camstack/types' VALUE import reachable from the
      # addon-runner or addon-utils, and no ALL_CAPABILITY_DEFINITIONS in addon
      # server code. Pure source scan, ~1 s; names file:line and the /addon fix.
      - name: Runner and addon sources are barrel-free (D28)
        if: matrix.shard == 'static'
        run: npx tsx scripts/check-runner-barrel-free.ts

      # D28: the BUILT addon-runner AND addon-utils must not carry the
      # @camstack/types schema barrel (~90-115 MB of heap in every runner). Reads
      # packages/system/dist, so it runs right after the build; ~2 s.
      - name: Runner dist is barrel-free (D28)
        if: matrix.shard == 'static'
        run: npx tsx scripts/check-runner-dist-barrel-free.ts

      # D28: no BUILT addon may name ALL_CAPABILITY_DEFINITIONS or grow the
      # runner's heap by more than 60 MB (scripts/addon-dist-footprint-budgets.json
      # grants a reasoned exception). Reads every packages/addon-*/dist, so it
      # runs right after the build. The runner-dist step above also probes
      # `@camstack/system/addon-utils` (seven hub runners load it).
      #
      # ~60 s over every addon dist, so a push runs it where an addon's built
      # output can change (verify:push does the same): the addons whose own
      # sources moved (`--addons`), or every addon when `packages/types/src`
      # moved (all of them bundle it). The nightly / manual run checks all.
      - name: Addon dist footprint (D28)
        if: matrix.shard == 'static'
        run: |
          if [ -f "$RUNNER_TEMP/scope.env" ]; then
            . "$RUNNER_TEMP/scope.env"
            if [ "$FOOTPRINT_ALL" = "1" ]; then
              npx tsx scripts/check-addon-dist-footprint.ts
            elif [ -n "$FOOTPRINT_ADDONS" ]; then
              npx tsx scripts/check-addon-dist-footprint.ts --addons "$FOOTPRINT_ADDONS"
            else
              echo "no addon source and no packages/types/src change — footprint unchanged"
            fi
          else
            npx tsx scripts/check-addon-dist-footprint.ts
          fi
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"

      # D3 (docs/design/2026-10-09-ts7-transition-plan.md): typecheck is out of
      # the three UI `build` gates and runs once here on TypeScript 7 (c1,
      # sequential). Peak ≈ admin-ui spec (~3 GB). Local `npm run typecheck`
      # stays tsc 6 until the Checks parity flip.
      - name: Typecheck (TypeScript 7)
        if: matrix.shard == 'static'
        # A push typechecks the packages it affects (`typecheck-tsgo.ts <dir>…`,
        # the grade against scripts/ci-baseline.json is unchanged and applies to
        # those packages); types / system affect everything, which is the full
        # sweep. The nightly / manual run is always the full sweep (237 s).
        run: |
          ARGS=""
          if [ -f "$RUNNER_TEMP/scope.env" ]; then
            . "$RUNNER_TEMP/scope.env"
            if [ -z "$TC_DIRS" ]; then
              echo "no project affected — nothing to typecheck"
              exit 0
            fi
            if [ "$TC_DIRS" != "ALL" ]; then ARGS="$TC_DIRS"; fi
          fi
          # shellcheck disable=SC2086
          scripts/ci/mem-step.sh typecheck-tsgo 12000 -- npx tsx scripts/typecheck-tsgo.ts $ARGS
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      # The suites that spawn ffmpeg get the binary the PRODUCT runs: the pinned
      # jellyfin-ffmpeg build of `ffmpeg-artifacts.ts`, downloaded by the same
      # code every node boots through (D540) — never whatever the runner
      # template's apt carries. It carried 4.2.7, for which Opus-in-MP4 is
      # "experimental" and refused without `-strict -2`: the Opus fallback
      # produced 0 access units and every fixture-gated Opus test skipped its
      # body in silence. Green-by-skip on a binary no node runs, red on the one
      # test that could not skip, on every push since 2026-09-22. (The step this
      # replaces, "Ensure ffmpeg is present", was the 2026-08-21 answer to a
      # template rebuild with no ffmpeg at all; this is still that answer, with
      # the right binary.)
      #
      # Cached under the workspace (gitignored). A hosted disk does not
      # outlive the job. After the build: the script imports
      # `@camstack/types/node` from dist.
      - name: Restore the pinned ffmpeg
        if: matrix.shard != 'static'
        uses: actions/cache@v4
        with:
          path: .camstack-ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('packages/types/src/deps/ffmpeg-artifacts.ts') }}

      - name: Provision the pinned ffmpeg (the binary the product runs)
        if: matrix.shard != 'static'
        run: npx tsx scripts/ci-provision-ffmpeg.ts "${{ github.workspace }}/.camstack-ffmpeg"
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"

      # A push tests ONLY the projects its commits touch (nx affected over the
      # push range); the nightly schedule and workflow_dispatch run everything.
      # Rationale: a full serial suite is ~40 min on this runner and the
      # operator's sessions push every few minutes — an every-push full suite
      # means main never has a fresh verdict (measured 2026-08-21, repeatedly).
      # On this runner: heavy suites serial, light addons --parallel=2
      # (scripts/ci/test-affected.sh). Overlapping heavies flaked pipeline
      # timing tests (38132637960 SIGTERM grace; 38133811367 preroll settle).
      - name: Test affected packages (push/PR)
        if: matrix.shard != 'static' && (github.event_name == 'push' || github.event_name == 'pull_request')
        run: |
          # The change set was written by `Compute the change set` (base = the
          # last commit main was verified at; see scripts/ci/changed-files.sh).
          CHANGED_FILE="$RUNNER_TEMP/changed-files.txt"
          CHANGED=$(paste -sd, - < "$CHANGED_FILE")
          if [ -z "$CHANGED" ]; then
            echo "no non-lockfile changes since the verified base — nothing affected"
            exit 0
          fi
          # The list goes to the script through a FILE: a tree-wide change used to
          # exceed one argv string (Linux MAX_ARG_STRLEN, 128 KiB) and fall back
          # to `--all`, which is how a stale base turned every push into the
          # full suite. test-affected.sh slices the list under the limit and
          # unions the affected sets (exact: affected is monotone per file).
          {
            echo "### Test affected — shard \`${{ matrix.shard }}\`"
            echo "- changed files (excl. lockfile): $(printf '%s' "$CHANGED" | tr ',' '\n' | grep -c . || true)"
            echo "- cascade flags: types=$(printf '%s' "$CHANGED" | grep -q 'packages/types/' && echo yes || echo no) system=$(printf '%s' "$CHANGED" | grep -q 'packages/system/' && echo yes || echo no) ui-library=$(printf '%s' "$CHANGED" | grep -q 'packages/ui-library/' && echo yes || echo no)"
          } >> "$GITHUB_STEP_SUMMARY"
          scripts/ci/mem-step.sh test-affected 12000 -- \
            scripts/ci/test-affected.sh --shard "${{ matrix.shard }}" --files-from "$CHANGED_FILE"
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITEST_MAX_WORKERS: "2"
          LIGHT_PARALLEL: "2"
        # Per shard now (the history below is the single serial job). 60 is far
        # above the slowest shard (post-analysis, ~20 min) and still names a hang.
        #
        # 55, not 40, and the job's own budget is 60 — the step could never
        # reach it. A change to `packages/types` makes nx mark EVERY package
        # affected (the cascade is correct: they all consume it), so "test
        # affected" becomes "test everything". Heavies stay serial; light
        # addons share LIGHT_PARALLEL (budget 12 GB).
        # Measured 2026-09-23: that run was killed by this
        # step at exactly 40 minutes, mid-`addon-admin-ui`, with nothing red.
        # So a types change could not pass CI at all, and the red it produced
        # said "timed out" where a reader looks for a failing test.
        #
        # Raising the step rather than the parallelism on purpose: overlapping
        # heavy suites flake. `VITEST_MAX_WORKERS: 2` stays for that reason.
        # Two forks at a 4 GB heap fit in the 16 GB hosted runner.
        #
        # 90, not 55 (2026-09-27). 55 stopped fitting too: run 36322518829
        # (a types change, so every package) was killed at 55:12 inside
        # `addon-export-hap`, the 15th of 43 test projects, with every suite
        # that had run green. The 14 before it took 55 min on their own
        # (system 11.4, pipeline 12.2, admin-ui 8.7, server 8.9, ui-library
        # 5.9 …); the 29 left are the small addons, 5–80 s each. And the
        # timeout fed itself: the affected base is the last GREEN run, so a
        # red run leaves the next push with the same everything-affected set.
        # The nightlies of 2026-09-25, 26 and 27 timed out the same way.
        timeout-minutes: 60

      - name: Test all packages (nightly / manual)
        if: matrix.shard != 'static' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: scripts/ci/mem-step.sh test-all 12000 -- scripts/ci/test-affected.sh --shard "${{ matrix.shard }}" --all
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITEST_MAX_WORKERS: "2"
          LIGHT_PARALLEL: "2"
        # Same heavy/light split as push; nightlies of 2026-09-25/26/27 timed
        # out on N100 at full serial before the step ceiling was raised.
        timeout-minutes: 60

      # `npm run test` is `nx run-many -t test`, and nx only knows WORKSPACE
      # packages — `scripts/` is not one. So every spec under `scripts/__tests__`
      # (the guards' own decision functions) has been unrunnable in CI since it
      # was written: not failing, never collected. A test nobody runs is the
      # leftover this repo keeps getting bitten by — it reads as verification.
      #
      # ~35 s, so a push runs it only when `scripts/` moved (what verify:push
      # does); the nightly / manual run always does.
      - name: Test repo scripts
        if: matrix.shard == 'static'
        run: |
          if [ -f "$RUNNER_TEMP/scope.env" ]; then
            . "$RUNNER_TEMP/scope.env"
            if [ "$SCRIPTS_CHANGED" != "1" ]; then echo "scripts/ unchanged — skipped"; exit 0; fi
          fi
          scripts/ci/mem-step.sh test-repo-scripts 8000 -- npm run test:scripts
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # Same leftover, second instance: the inference pool is PYTHON, so nx has
      # never collected `packages/addon-pipeline/python/test_*.py` either. The
      # load-time static-batch derivation (D202) — the rule that keeps a
      # dynamic-batch graph from hanging an NPU-pinned node forever — is
      # defended by those tests and by nothing else.
      - name: Test the inference pool (python)
        if: matrix.shard == 'static'
        run: ./scripts/test-python-pool.sh

      # actions/cache saves `.nx` when the key misses. An exact hit is not
      # rewritten, so unchanged packages stay warm and a changed package
      # rebuilds until the lockfile or nx.json changes the key.

  # A red nightly used to notify nobody (2026-10-27). On a failed or cancelled
  # scheduled run this opens ONE tracking issue (or comments on the open one);
  # the next green nightly closes it. Uses the run's own GITHUB_TOKEN with
  # `issues: write` on this job only — no secret.
  nightly-verdict:
    needs: tests
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.tests.result }}
      TITLE: Nightly CI is red
    steps:
      - name: Open, update or close the nightly tracking issue
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ "$RESULT" = "success" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" \
                --comment "The nightly is green again: $RUN_URL"
            fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" \
              --body "The nightly is still red ($RESULT): $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "The scheduled full CI run ended $RESULT: $RUN_URL"
          fi
