# One-off: copy the 0.1.0 image tags published before the GitHub org move into
# this org's registry, so the documented image exists before the next release
# builds it here. Manifest copy only (no rebuild); multi-arch lists are kept.
# Removed in the commit after its run.
name: Copy images to org registry

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy tags
        env:
          SOURCE: ghcr.io/camstack/dominevo
          TARGET: ghcr.io/${{ github.repository_owner }}/dominevo
        run: |
          set -euo pipefail
          for accel in intel amd nvidia intel-legacy nvidia-legacy; do
            for tag in "${accel}-0.1.0" "${accel}-latest"; do
              docker buildx imagetools create --tag "${TARGET}:${tag}" "${SOURCE}:${tag}"
              docker buildx imagetools inspect "${TARGET}:${tag}" --format '{{json .Manifest.Digest}}'
            done
          done
