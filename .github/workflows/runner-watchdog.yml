name: Runner watchdog

# Hourly. Notifies Zentik when a run has been queued for more than 30 minutes.
# On 2026-10-06 the agent-a runners showed "online, Listening for Jobs"
# while GitHub assigned them nothing (stale runner version): CI runs sat
# `queued` for days, all ended `cancelled`, and nobody noticed.
#
# Runs on the Mac mini runners ON PURPOSE: no GitHub-hosted minutes (operator
# rule: self-hosted only), and a different host and pool from the linux
# runners that CI uses, so a stuck linux pool is reported by a healthy one.
# What it cannot see — every runner dead — is covered on the hosts themselves:
# `gh-runner-watchdog` (agent-a, every 15 min, offline runners) and
# `gh-runner-refresh` (weekly, both Unraid hosts and the Mac mini).
#
# Alerts only runs queued 30-90 min, so a stuck run is reported once (twice at
# most) rather than every hour until GitHub cancels it.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  queued-runs:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Alert on runs queued for more than 30 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          ZENTIK_MAGIC_CODE: ${{ secrets.ZENTIK_MAGIC_CODE }}
          REPO: ${{ github.repository }}
        run: |
          stuck=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs?status=queued&per_page=100" |
            jq -r '.workflow_runs[]
              | ((now - (.created_at | fromdateiso8601)) / 60 | floor) as $age
              | select($age > 30 and $age <= 90)
              | "• \(.name) (\(.head_sha[0:9])) queued \($age) min — \(.html_url)"')
          if [ -z "$stuck" ]; then
            echo "No run queued for more than 30 min."
            exit 0
          fi
          echo "$stuck"
          if [ -z "$ZENTIK_MAGIC_CODE" ]; then
            echo "::warning::ZENTIK_MAGIC_CODE secret not set; not notifying"
            exit 0
          fi
          jq -n --arg m "$ZENTIK_MAGIC_CODE" --arg t "CI queued: $REPO" \
            --arg b "$stuck" '{magicCode: $m, title: $t, body: $b}' |
            curl -fsS -o /dev/null -H 'Content-Type: application/json' -X POST -d @- \
              https://notifier-api.zentik.app/message
