name: Checks

# ON-DEMAND ONLY (D704). Everything that judges the tree beyond "it builds and
# its tests pass": repository guards, codegen drift, the pinned-debt ratchet
# (typecheck / oxlint / format / double-cast), the docs checks, and the e2e
# suite. Run it before a release, or after touching what a guard protects:
#
#   gh workflow run Checks --ref main
#
# `docs/reference/guards.md` is generated by searching THIS file and `ci.yml`
# for guard file names (scripts/docs-generate.ts), so a guard listed here is
# documented as enforced by the on-demand checks.

on:
  workflow_dispatch:

permissions:
  contents: read
  # Nx cache save, and the e2e failure artifact.
  actions: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:

  static:
    # GitHub-hosted, 16 GB. This job's heap is the D704 static typecheck
    # ceiling. The build step overrides it: three tasks at 8 GB do not fit.
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    runs-on: ubuntu-latest
    # Cold (a rebuilt runner, empty nx cache): ~3 min install + ~8 min build +
    # ~17 min typecheck + ~guards/codegen ≈ 33 min cold. Warm: ≈ 12 min.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same Nx cache as ci.yml: both directories, then align the database
      # file onto this machine's id. See scripts/ci/align-nx-db.sh.
      - name: Restore the Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'nx.json') }}
          restore-keys: |
            nx-${{ runner.os }}-${{ runner.arch }}-

      - name: Point the restored Nx database at this machine
        run: |
          echo "NX_DAEMON=false" >> "$GITHUB_ENV"
          echo "NX_MAX_CACHE_SIZE=4GB" >> "$GITHUB_ENV"
          bash scripts/ci/align-nx-db.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `nx.json` lists `@camstack/nx-plugin` as a workspace plugin, and nx
      # refuses to load a local plugin whose `main` (./dist/index.js) does not
      # exist. A hosted runner is a fresh clone: EVERY nx command dies
      # with "Unable to resolve local plugin" before doing any work. Build it
      # with plain tsc first — this is the one build that cannot go through nx.
      - name: Bootstrap the Nx plugin (chicken-and-egg)
        run: npm run build -w packages/nx-plugin

      - name: Check inter-package dependencies
        run: npm run check-deps

      - name: Check no .d.ts leaks in packages/*/src (pre-build)
        run: bash scripts/check-no-dts-in-src.sh

      # `npm run build` is `nx run-many -t build` — the command the repo
      # actually uses. Do NOT "improve" this to `nx build <project>`: that form
      # hangs here.
      #
      # AND DO NOT MOVE IT AFTER THE TESTS. Packages resolve `@camstack/types`
      # (and sdk / ui-library / system) through their `dist/`, which a fresh
      # checkout does not have. Run the suite first and every spec that touches
      # a recently-added schema field fails against a phantom older build: on
      # 2026-07-31 that was 10 failures in `addon-post-analysis` that pointed
      # squarely at the rule engine and were entirely a stale `types/dist`.
      # `npm run build -w packages/types` and the same suite passed 1924.
      # `addon-admin-ui` will not even build without types+sdk+ui-library dist.
      #
      # Same bound as ci.yml: two nx tasks at once and a 4 GB heap
      # (docs/design/2026-10-09-ts7-transition-plan.md §P0). Without a flag nx
      # runs three tasks, each allowed the job-wide 8 GB heap. The peak is now
      # reported by scripts/ci/mem-step.sh (a warning over budget, never a
      # failure unless MEM_BUDGET_ENFORCE=1).
      - name: Build all packages
        run: scripts/ci/mem-step.sh build 12000 -- npm run build -- --parallel=3
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Check no .d.ts leaks in packages/*/src (post-build)
        run: bash scripts/check-no-dts-in-src.sh

      # Codegen drift guard: the types dist was just built above, so regenerate
      # every codegen output and fail if any drifts from what is committed. This
      # catches the "changed a cap / shipped stale types → generated files (incl.
      # addon-api.ts) silently stale" trap that bit us twice.
      - name: Check codegen is up to date (no drift)
        run: scripts/ci/mem-step.sh codegen-check 3000 -- npm run codegen:check

      # Repository guards. These encode invariants a review cannot reliably
      # catch (D4 manifest metadata drift, D11 raw event topics, undeclared
      # settings collections, missing event-kind taxonomy entries, dynamic
      # eval, D28 runner barrel imports, the viewer ship chain).
      #
      # They run as a loop rather than as separate steps for one reason: `set
      # -e` would stop at the first failure and hide the rest, so a session
      # fixing them would burn one CI round-trip per guard.
      - name: Repository guards
        run: |
          # The sweep is a function so scripts/ci/mem-step.sh can wrap it whole
          # (a heredoc on stdin would not survive the wrapper's background run).
          # The body is unchanged and its guard list stays inline.
          guards() {
          # Two at a time (`xargs -P2`): the runner has four cores and shares
          # them with a live CamStack agent, and every guard is a read-only
          # scan, so two in flight halves the sweep without the timing lottery
          # that parallel TEST suites hit here. Output is printed per guard,
          # whole, when it finishes — never interleaved. A failure is recorded
          # and the sweep continues, so one CI round-trip shows every red guard.
          #
          # The list stays INLINE, as literal file names: `docs/reference/
          # guards.md` is generated by searching this file for them, and a list
          # moved to a script would make the page report all of them unenforced.
          #
          # Five names left this list on 2026-09-20 (D548): four guards that
          # read ONE package now run as that package's tests
          # (`src/__tests__/guards/*.guard.ts` in addon-pipeline and
          # server/backend), and `check-npm-orphan-packages` — which asks the
          # npm registry, a fact about the world and not about the commit —
          # runs in the nightly step below.
          rm -rf "$RUNNER_TEMP/guards" && mkdir -p "$RUNNER_TEMP/guards"
          printf '%s\n' \
            scripts/check-cap-status-type-imports.ts \
            scripts/check-method-tiers.ts \
            scripts/check-method-roles.ts \
            scripts/check-viewer-calls-allowed.ts \
            scripts/check-capability-metadata-drift.ts \
            scripts/check-capability-union-complete.ts \
            scripts/check-collection-declarations.ts \
            scripts/check-collection-database-placement.ts \
            scripts/check-event-bus-usage.ts \
            scripts/check-event-kind-coverage.ts \
            scripts/check-cap-vocabulary.ts \
            scripts/check-recording-trigger-fed.ts \
            scripts/check-summary-ladder-reachable.ts \
            scripts/check-log-channel-gated.ts \
            scripts/check-no-dynamic-eval.ts \
            scripts/check-addon-entries.ts \
            scripts/check-addon-readme-changelog.ts \
            scripts/check-changelog-unreleased.ts \
            scripts/check-readmes-current.ts \
            scripts/check-storage-access-declarations.ts \
            scripts/check-pkg-allowlist.ts \
            scripts/check-store-census-not-on-a-timer.ts \
            scripts/check-storage-write-target-enabled.ts \
            scripts/check-storage-location-mode-single-owner.ts \
            scripts/check-registered-caps-declared.ts \
            scripts/check-device-scoped-wrapper-mounts.ts \
            scripts/check-extension-slots.ts \
            scripts/check-field-claims.ts \
            scripts/check-owner-only-events.ts \
            scripts/check-onboard-motion-emitters.ts \
            scripts/check-claimed-get-status.ts \
            scripts/check-composed-methods.ts \
            scripts/check-device-selection-authority.ts \
            scripts/check-clip-crop-single-owner.ts \
            scripts/check-single-prebuffer-knob.ts \
            scripts/check-cluster-model-scope.ts \
            scripts/check-model-notices-shipped.ts \
            scripts/check-catalog-licence.ts \
            scripts/check-label-link-vocabulary.ts \
            scripts/check-llm-library-boundary.ts \
            scripts/check-decision-ids-unique.ts \
            scripts/check-user-facing-decision-ids.ts \
            scripts/check-no-publish-lifecycle-script.mjs \
            scripts/check-no-client-secrets.ts \
            scripts/check-secret-fields-declared.ts \
            scripts/check-global-schema-declared.ts \
            scripts/check-no-raw-secret-read.ts \
            scripts/check-keychain-backed-rows.ts \
            scripts/check-no-raw-secrets-in-collections.ts \
            scripts/check-dbfs-era.ts \
            scripts/check-sqlite-files-not-opened-by-fs.ts \
            scripts/check-session-jwt-single-mint.ts \
            scripts/check-recorded-still-off-delivery-path.ts \
            scripts/check-pull-demuxer-open.ts \
            scripts/check-decode-worker-child-lean.ts \
            scripts/check-no-detached-child-spawn.ts \
            scripts/check-replay-isolation.ts \
            scripts/check-age-keyed-retention.ts \
            scripts/check-sweep-coverage.ts \
            scripts/check-retention-settings-consumed.ts \
            scripts/check-prune-settings-consumed.ts \
            scripts/check-orphan-reclaimers.ts \
            scripts/check-object-media-scope-required.ts \
            scripts/check-event-media-generation-url.ts \
            scripts/check-runner-barrel-free.ts \
            scripts/check-schema-type-twins.ts \
            scripts/check-addon-types-entry.ts \
            scripts/check-viewer-web-build.ts \
            scripts/check-viewer-pin-resolves.ts \
            scripts/check-single-recorded-surface.ts \
            scripts/check-single-copy-layout.ts \
            scripts/check-silent-observation-drop.ts \
            scripts/check-inventory-never-fatal.ts \
            scripts/check-collection-namespacing.ts \
            scripts/check-viewer-condition-mirror.ts \
            scripts/check-ffmpeg-primitive.ts \
            scripts/check-no-bare-ffmpeg.ts \
            scripts/check-no-glyph-chevrons.ts \
            scripts/check-addon-id-comparison.ts \
            scripts/check-addon-root-is-the-only-load-path.ts \
            scripts/check-fleet-query-defaults.ts \
            scripts/check-no-conflict-markers.ts \
            scripts/check-package-promotion-satisfiable.ts \
            scripts/check-stationary-promotion-reachable.ts \
            scripts/check-safe-area-overlays.ts \
            scripts/check-hub-paths-through-mount.ts \
            scripts/check-addon-icons-shipped.ts \
            scripts/check-settings-help-length.ts \
            scripts/check-skill-pack-sync.ts \
            scripts/check-ui-catalogue-current.ts \
            scripts/check-host-widget-resolves.ts \
            scripts/check-addon-page-css.ts \
            scripts/check-step-model-single-owner.ts \
            scripts/check-nc-simulate-mirror.ts \
            scripts/check-nc-system-filter-scope.ts \
            scripts/check-declared-device-single-owner.ts \
            scripts/check-no-device-links.ts \
            scripts/check-addon-pin-refusal.ts \
            scripts/check-no-commit-sha-references.ts \
            scripts/check-collection-cap-pin.ts \
            scripts/check-videoclips-footage-owner.ts \
            scripts/check-runner-group-isolation.ts \
            scripts/check-cgroup-path-single-owner.ts \
            scripts/check-cap-name-kebab.ts \
            scripts/check-spec-dynamic-imports-declared.ts \
            scripts/check-authored-fields-reachable.ts \
            scripts/check-nc-text-catalog.ts \
            scripts/check-no-array-event-subscribe.ts \
            scripts/check-no-literal-addon-process-mode.ts \
            scripts/check-switch-successor-surfaces.ts \
            scripts/check-actuation-not-admin.ts \
            scripts/check-viewer-build-carries-no-server.ts \
            scripts/check-desktop-update-feeds.ts \
            scripts/check-runtime-state-durability.ts \
            scripts/check-cap-history-declared.ts \
            scripts/check-no-state-unit-sibling.ts \
            scripts/check-device-field-quantity-names.ts \
            scripts/check-customize-declaration.ts \
            scripts/check-customize-apply-add.ts \
            scripts/check-customize-bespoke-card.ts \
            scripts/check-customize-parameters.ts \
            scripts/check-history-single-mechanism.ts \
            scripts/check-runtime-state-row-writers.ts \
            scripts/check-durable-state-declared.ts \
            scripts/check-physical-tables-ratchet.ts \
            scripts/check-records-index-served.ts \
            scripts/check-records-no-unindexed-where.ts \
            scripts/check-device-settings-standard.ts \
            scripts/check-hub-settings-ready-before-forks.ts \
            scripts/check-export-coverage.ts \
            scripts/check-no-credential-urls-in-fixtures.ts \
            scripts/check-admin-link-builder-is-the-only-url-source.ts \
            scripts/check-integration-hub-links.ts \
            scripts/check-addon-install-links.ts \
            scripts/check-clip-reason-header-is-folded.ts \
            scripts/check-catalog-per-device-isolation.ts \
            scripts/check-log-channel-single-declaration.ts \
            scripts/check-no-service-account-keys.ts \
            scripts/check-settings-key-has-reader.ts \
            scripts/check-intercom-rate-refusal.ts \
            scripts/check-mem-heartbeat-has-a-destination.ts \
            scripts/check-no-heap-dump-command.ts \
            scripts/check-no-retired-fanout-heap-env.ts \
            scripts/check-recorder-index-residency.ts \
            scripts/check-seal-authority.ts \
            scripts/check-scope-preset-promises.ts \
            scripts/check-method-access-map-coverage.ts \
            scripts/check-notification-tap-targets.ts \
            scripts/check-viewer-link-builder-is-the-only-source.ts \
            scripts/check-absent-claim-is-answered.ts \
            scripts/check-topology-is-a-diagram-not-a-lookup.ts \
            scripts/check-container-priority-in-sync.ts \
            scripts/check-device-selection-in-sync.ts \
            scripts/check-device-name-rendered-via-component.ts \
            scripts/check-device-name-in-sync.ts \
            scripts/check-nc-mirrors-in-sync.ts \
            scripts/check-nc-one-shot.ts \
            scripts/check-icon-catalog.ts \
            scripts/check-closure-shipped-deps.ts \
            scripts/check-runtime-deps-reachable-from-dist.ts \
            scripts/check-parked-frame-no-handle-fallback.ts \
            scripts/check-patches-reach-production.ts \
            scripts/check-inlined-sources-known.ts \
            scripts/check-drain-listener-rearmed.ts \
            scripts/check-clip-provider-parity.ts \
            scripts/check-reserved-collection-sources.ts \
            scripts/check-no-legacy-tracker.ts \
            scripts/check-no-camera-model-layer.ts \
            scripts/check-no-hub-address-env.ts \
            scripts/check-no-private-lan-scan.ts \
            scripts/check-addon-calls-super.ts \
            scripts/check-no-token-file-lookup.ts \
            scripts/check-no-legacy-token-prefix.ts \
            scripts/check-slab-writes-held.ts \
            scripts/check-secret-files-owner-only.ts \
            scripts/check-specs-have-test-script.ts \
            scripts/check-heavy-specs.ts \
            scripts/check-specs-are-typechecked.ts \
            scripts/check-src-imports-stay-in-package.ts \
            scripts/check-admin-i18n.ts \
          | xargs -P2 -n1 sh -c '
              out=$(npx tsx "$1" 2>&1); rc=$?
              printf "── %s (exit %s)\n%s\n" "$1" "$rc" "$out"
              [ "$rc" -eq 0 ] || echo "$1" >> "$RUNNER_TEMP/guards/failed"
              exit 0' _
          if [ -s "$RUNNER_TEMP/guards/failed" ]; then
            echo "::error::failing guards: $(paste -sd' ' "$RUNNER_TEMP/guards/failed")"
            exit 1
          fi
          }
          export -f guards
          scripts/ci/mem-step.sh guards 4000 -- bash -c guards
      # Guards whose subject is the WORLD, not the commit: the npm registry can
      # change with no push at all, and a push cannot fix what it reports. They
      # run where the full suite runs — nightly, and on demand — and never gate
      # a push on somebody else's registry state.
      - name: Repository guards about the world outside the commit (nightly / manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npx tsx scripts/check-npm-orphan-packages.ts

      # typecheck / oxlint / biome format / double-cast, each pinned per bucket
      # in `scripts/ci-baseline.json`. The repo does not pass any of the four
      # today (30 tsc errors over 8 packages, 3 lint errors, 36 unformatted
      # files, 197 double-casts) and this change is not the place to fix other
      # people's packages — so the guard fails on anything NEW and stays quiet
      # about what was already there. Turning a check off instead would have
      # hidden the next regression for months.
      #
      # It replaces the plain `npm run typecheck` / `lint` / `format:check`
      # steps: running those as well would just be a guaranteed red.
      #
      # SPECS ARE TYPECHECKED HERE TOO (D695, 2026-10-01). A package with specs
      # runs `tsc -p tsconfig.spec.json` as its `typecheck` — one program over
      # code and specs — and the guard splits the diagnostics by file: code in
      # `typecheck` (held at zero), specs in `typecheck-specs` (pinned per file,
      # 1 762 on the day it started). One program instead of a second target
      # per package: 5 m 27 s instead of ~9 min for the sweep, measured locally
      # at two-way parallelism (4 m 03 s before specs were included).
      # The step name names `scripts/lint-double-cast.sh` on purpose: the guard
      # runs through the wrapper, and `docs/reference/guards.md` is generated by
      # searching this file for guard filenames. Rename the step and the docs
      # will say the guard is unenforced.
      #
      # Graded on TypeScript 7 (tsgo --checkers 1) since the 2026-10-13 flip
      # (D832, docs/design/2026-10-09-ts7-transition-plan.md): `check-ci-baselines.ts`
      # defaults to tsgo; `--engine=tsc` is the tsc 6 reference and
      # `typecheck-tsgo.ts --parity` compares both by hand when a TS bump needs it.
      - name: Pinned-debt guard (typecheck, oxlint, format, scripts/lint-double-cast.sh)
        run: scripts/ci/mem-step.sh pinned-debt 12000 -- npx tsx scripts/check-ci-baselines.ts

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Docs guards (english, no private data in public working docs)
        run: |
          npx tsx scripts/check-docs-english.ts
          npx tsx scripts/check-public-docs-private-data.ts
          npx tsx scripts/check-tree-private-data.ts
          npx tsx scripts/check-no-third-party-products.ts

      - name: Check docs are in sync (no drift)
        run: |
          npx tsx scripts/docs-generate.ts --check
          npx tsx scripts/gen-api-reference.ts --check
          npx tsx scripts/check-docs-drift.ts --committed-only
          npx tsx scripts/check-subsystem-map.ts --committed-only
          npx tsx scripts/gen-model-licenses.ts --check

      # These specs walk the whole repo or build throwaway git repos; under load
      # they hit vitest's 10 s timeout (2026-10-13), so the per-push CI skips
      # them. Checks is on-demand and owns these guards.
      - name: Slow repo-script specs (real tree, docs staleness, skill pointers)
        run: npm run test:scripts:slow

  e2e:
    runs-on: ubuntu-latest
    needs: [static]
    timeout-minutes: 30
    # Manual dispatch ONLY. The suite spawns a real hub; keep it deliberate
    # even on the CI host (ports / leftover processes). Watch it when you run it.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      CAMSTACK_E2E_LIVE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'nx.json') }}
          restore-keys: |
            nx-${{ runner.os }}-${{ runner.arch }}-

      - name: Point the restored Nx database at this machine
        run: |
          echo "NX_DAEMON=false" >> "$GITHUB_ENV"
          echo "NX_MAX_CACHE_SIZE=4GB" >> "$GITHUB_ENV"
          bash scripts/ci/align-nx-db.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap the Nx plugin (chicken-and-egg)
        run: npm run build -w packages/nx-plugin

      - name: Build all packages
        run: scripts/ci/mem-step.sh build 12000 -- npm run build -- --parallel=3
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run E2E suite
        run: npm run test:e2e

      # Multi-broker cluster specs, kept out of the per-push CI (they time out
      # under load): every package's `test:cluster` lane (packages/system,
      # server/backend).
      - name: Run cluster specs (hub + agents over TCP)
        run: npm run test:cluster
        timeout-minutes: 20

      # Heavy specs (`*.heavy.spec.*`): timing-bound under machine load, passing
      # alone, so every default lane excludes them (docs/architecture/testing.md).
      # They run here, on an otherwise idle runner. scripts/check-heavy-specs.ts
      # fails if this step goes away.
      - name: Run heavy specs
        run: npm run test:heavy
        timeout-minutes: 20

      - name: Upload e2e failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
