# The subsystem taxonomy — the ONLY hand-written index input in this repository.
#
# Everything else under `docs/reference/` is derived from the workspace and so
# cannot rot. A subsystem cannot be derived: nothing in the manifests says that
# decode, inference, tracking and the confirmation gate are one story, or that
# `addon-export-hap` and `provider-homeassistant/src/ha-export` are two halves of
# "ecosystem export". Manifests know packages, capabilities know methods, the
# call graph knows edges — none of them knows chapters.
#
# So: curate the chapters here, generate every join over them.
#   docs/reference/subsystems.md   what each chapter is, and what inside it no document claims
#   docs/reference/coverage.md     the same data by unit of code
# Both are written by `scripts/docs-generate.ts` and guarded by
# `scripts/check-subsystem-map.ts`. Never edit them by hand.
#
# Rules for editing this file:
#   - `purpose` is ONE sentence and is the only free prose. What a reader wants
#     next — file counts, claiming documents, freshness, holes — is computed.
#   - `owner-doc` is the page that OWNS the chapter. Omit it while nobody has
#     written one; the index then reports the chapter as ❌, which is the point.
#   - A glob matching nothing FAILS the guard: the chapter outlived its code.
#   - A file may belong to several chapters. That is legitimate — a cap
#     definition belongs to both its feature and the capability system — and the
#     map does not force it unique.
#   - Order is editorial and is preserved in the rendered index. Roughly: the
#     kernel outward, then the data planes, then everything built on them.
#
# Parser: `parseSubsystemsYaml` in `scripts/lib/subsystem-map.ts` — a deliberate
# YAML subset (sequence of mappings, scalars, a folded `purpose: >`, a `globs:`
# list). A real YAML dependency here would be a dependency in the pre-commit hook.

